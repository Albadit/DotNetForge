version: 2
updates:
  # Keep NuGet packages (central versions in Directory.Packages.props) up to date.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "Npgsql.*"

  # Keep GitHub Actions versions up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
