name: CI

# Build and test DotNetForge CMS on every push and pull request.
# The build/test job runs on all three platforms to honour the spec's
# cross-platform acceptance criterion (Windows, macOS, Linux).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show .NET version
        run: dotnet --info

      - name: Restore local tools
        run: dotnet tool restore

      - name: Create .env (SQLite)
        shell: bash
        run: cp .env.example .env

      - name: Build (solution)
        run: dotnet build DotNetForge.slnx --configuration Release

      - name: Unit tests
        run: dotnet test tests/DotNetForge.Tests --configuration Release --verbosity normal

      - name: Integration tests
        run: dotnet test tests/DotNetForge.IntegrationTests --configuration Release --verbosity normal

  format:
    name: Format & style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify formatting (.editorconfig)
        shell: bash
        run: |
          set -e
          for proj in src/*/*.csproj tests/*/*.csproj; do
            echo "::group::dotnet format $proj"
            dotnet format "$proj" --verify-no-changes --severity error
            echo "::endgroup::"
          done

  postgres-and-s3:
    # The same integration tests against PostgreSQL (its own migration set) plus the live S3 contract tests
    # against an S3-compatible server (.docs/guides/testing.md).
    name: PostgreSQL + S3 storage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DNF_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres;GSS Encryption Mode=Disable
      DNF_TEST_S3_SERVICE_URL: http://localhost:8333
      DNF_TEST_S3_BUCKET: dnf-test
      DNF_TEST_S3_ACCESS_KEY_ID: ci
      DNF_TEST_S3_SECRET_ACCESS_KEY: ci
      DNF_TEST_S3_FORCE_PATH_STYLE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Start S3-compatible server
        shell: bash
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs server -s3 -dir=/data
          until curl -sf -X PUT http://localhost:8333/dnf-test; do sleep 1; done

      - name: Unit tests (incl. live S3 contract tests)
        run: dotnet test tests/DotNetForge.Tests --configuration Release

      - name: Integration tests on PostgreSQL
        run: dotnet test tests/DotNetForge.IntegrationTests --configuration Release

  database-providers:
    # The full integration suite on the other supported databases (.docs/database/providers.md#testing): each
    # provider must behave like SQLite and PostgreSQL for the CMS and for IDatabaseService.
    name: Integration tests (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: sqlserver
            start: >-
              docker run -d --name db -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=DotNetForge!2026 -p 1433:1433
              mcr.microsoft.com/mssql/server:2022-latest
            ready: "docker logs db 2>&1 | grep -q 'SQL Server is now ready'"
            variable: DNF_TEST_SQLSERVER
            connection: Server=localhost,1433;User Id=sa;Password=DotNetForge!2026;TrustServerCertificate=true
          - provider: mysql
            start: docker run -d --name db -e MYSQL_ROOT_PASSWORD=dotnetforge -p 3306:3306 mysql:8.4
            ready: "docker exec db mysqladmin -uroot -pdotnetforge ping 2>/dev/null | grep -q alive"
            variable: DNF_TEST_MYSQL
            connection: Server=localhost;Port=3306;Uid=root;Pwd=dotnetforge
          - provider: mongodb
            # A single-node replica set: the CMS saves several documents at once, which needs transactions.
            start: docker run -d --name db -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
            ready: >-
              docker exec db mongosh --quiet --eval
              'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}).ok }'
              | grep -q 1
            variable: DNF_TEST_MONGODB
            connection: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Start ${{ matrix.provider }}
        shell: bash
        run: |
          ${{ matrix.start }}
          for i in $(seq 1 90); do if ${{ matrix.ready }}; then exit 0; fi; sleep 2; done
          docker logs db; exit 1

      - name: Integration tests on ${{ matrix.provider }}
        # Only this entry's variable is non-empty; an empty one means "not configured" (TestDatabaseServer).
        env:
          DNF_TEST_SQLSERVER: ${{ matrix.variable == 'DNF_TEST_SQLSERVER' && matrix.connection || '' }}
          DNF_TEST_MYSQL: ${{ matrix.variable == 'DNF_TEST_MYSQL' && matrix.connection || '' }}
          DNF_TEST_MONGODB: ${{ matrix.variable == 'DNF_TEST_MONGODB' && matrix.connection || '' }}
        run: dotnet test tests/DotNetForge.IntegrationTests --configuration Release

  read-only-container:
    # Builds the production image and boots it with a read-only root filesystem: startup, migrations and the
    # setup screen must work without writing into the deployment directory (.docs/guides/deployment.md).
    name: Read-only container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t dotnetforge:ci .

      - name: Run read-only and probe
        shell: bash
        run: |
          # Startup validates the S3 settings but does not contact the bucket, and this probe uploads nothing,
          # so placeholder values are enough here; uploads against a real S3 server run in postgres-and-s3.
          docker run -d --name app --read-only --tmpfs /tmp -p 8080:8080 \
            -e "DATABASE_CONNECTION_STRING=Data Source=/tmp/cms.db" \
            -e STORAGE_S3_SERVICE_URL=http://s3.invalid -e STORAGE_S3_BUCKET=ci \
            -e STORAGE_S3_ACCESS_KEY_ID=ci -e STORAGE_S3_SECRET_ACCESS_KEY=ci \
            dotnetforge:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:8080/setup
          test -z "$(docker diff app)"
          docker logs app

      - name: Container logs on failure
        if: failure()
        run: docker logs app || true
