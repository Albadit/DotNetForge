name: CI

# Build and test DotNetForge CMS on every push and pull request.
# The build/test job runs on all three platforms to honour the spec's
# cross-platform acceptance criterion (Windows, macOS, Linux).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show .NET version
        run: dotnet --info

      - name: Restore local tools
        run: dotnet tool restore

      - name: Create .env (SQLite)
        shell: bash
        run: cp .env.example .env

      - name: Build (web host + referenced libraries)
        run: dotnet build --configuration Release

      - name: Unit tests
        run: dotnet test tests/DotNetForge.Tests --configuration Release --verbosity normal

      - name: Integration tests
        run: dotnet test tests/DotNetForge.IntegrationTests --configuration Release --verbosity normal

  format:
    name: Format & style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify formatting (.editorconfig)
        shell: bash
        run: |
          set -e
          for proj in DotNetForge.Web.csproj src/*/*.csproj tests/*/*.csproj; do
            echo "::group::dotnet format $proj"
            dotnet format "$proj" --verify-no-changes --severity error
            echo "::endgroup::"
          done
