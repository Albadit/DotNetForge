# Ceph (Squid) in one container - monitor, manager, OSD and the RADOS Gateway (S3) - from the official demo image (no
# longer rebuilt since Dec 2024; fine for development). It creates the S3 user and the bucket on first start, which
# takes about a minute (.docs/guides/development.md#production-like-s3-and-email).
#   docker compose -f docker/s3/ceph.yml up -d
# .env (the Ceph block of .env.developer):
#   STORAGE_S3_SERVICE_URL=http://127.0.0.1:7480
#   STORAGE_S3_BUCKET=dotnetforge
#   STORAGE_S3_ACCESS_KEY_ID=dotnetforge-dev
#   STORAGE_S3_SECRET_ACCESS_KEY=dotnetforge-dev-secret
#   STORAGE_S3_REGION=us-east-1
#   STORAGE_S3_FORCE_PATH_STYLE=true
# Use 127.0.0.1, not localhost: the gateway takes an unknown host name for a bucket name (NoSuchBucket). The monitor
# needs a fixed address, hence its own network. Development only: the keys are public.

name: dotnetforge

services:
  ceph:
    image: quay.io/ceph/demo:latest-squid
    environment:
      MON_IP: 172.30.250.10
      CEPH_PUBLIC_NETWORK: 172.30.250.0/24
      DEMO_DAEMONS: mon,mgr,osd,rgw
      CEPH_DEMO_UID: dotnetforge
      CEPH_DEMO_ACCESS_KEY: dotnetforge-dev
      CEPH_DEMO_SECRET_KEY: dotnetforge-dev-secret
      CEPH_DEMO_BUCKET: dotnetforge
    networks:
      ceph:
        ipv4_address: 172.30.250.10
    ports:
      - "7480:8080"
    volumes:
      - ceph-data:/var/lib/ceph
      - ceph-config:/etc/ceph

networks:
  ceph:
    ipam:
      config:
        - subnet: 172.30.250.0/24

volumes:
  ceph-data:
  ceph-config:
