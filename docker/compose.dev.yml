# Local development services (.docs/guides/development.md#production-like-s3-and-email): PostgreSQL 17, RustFS (S3
# with access keys) and Mailpit (SMTP with a sign-in) - the services .env.developer is filled in for.
#   cp .env.developer .env
#   docker compose -f docker/compose.dev.yml up -d
#   dotnet run --project src/DotNetForge.Web
# Stop with "docker compose -f docker/compose.dev.yml down" (add -v to delete the data).
#
# Every service also has its own file to start alone or instead (same project "dotnetforge", so they share data):
#   docker/databases/  postgres.yml, mongodb.yml, sqlserver.yml, mysql.yml
#   docker/s3/         rustfs.yml, ceph.yml, seaweedfs.yml (no authentication; the live S3 tests use it)
#   docker/mail/       mailpit.yml
# e.g. docker compose -f docker/databases/mysql.yml up -d. The app itself in a container: docker/compose.app.yml.
# Development only: every password and key here is public. Never expose these ports.

name: dotnetforge

include:
  - databases/postgres.yml
  - s3/rustfs.yml
  - mail/mailpit.yml
